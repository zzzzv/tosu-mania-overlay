<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mania Result</title>
    <style>
      html, body {
        margin: 0;
        overflow: hidden;
        width: 800px;
        height: 580px;
      }
      #app {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        position: relative;
        height: 100%;
        color: #ffffff;
        background: rgba(0, 33, 71, 0.9);
        opacity: 0;
      }
      #status-panel {
        margin: 12px 12px 0;
        flex: 0 0 auto;
        z-index: 10;
      }
      #content {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #timeline {
        flex: 1;
        min-height: 0;
      }
      #columns {
        flex: 0 0 auto;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 88px;
        padding: 0 12px 8px;
        font-size: 13px;
        line-height: 22px;
        font-variant-numeric: tabular-nums;
      }
      #columns table {
        width: 100%;
        table-layout: fixed;
        border-collapse: collapse;
      }
      #columns th {
        width: 84px;
        padding: 0 8px 0 0;
        color: rgba(255, 255, 255, 0.6);
        font-weight: normal;
        text-align: left;
      }
      #columns td {
        text-align: center;
        white-space: nowrap;
      }
      #columns td:nth-child(odd) {
        background: rgba(255, 255, 255, 0.05);
      }
      #summary {
        flex: 0 0 auto;
        box-sizing: border-box;
        height: 52px;
        padding: 0 12px 10px;
        color: rgba(255, 255, 255, 0.86);
        font-size: 14px;
        line-height: 21px;
        white-space: nowrap;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="status-panel"></div>
      <div id="content">
        <div id="timeline"></div>
        <div id="columns"></div>
        <div id="summary"></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
